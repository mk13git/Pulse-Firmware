name: Build Cardputer firmware

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PlatformIO
        run: pip install platformio esptool

      - name: Build firmware
        run: pio run

      - name: Merge into single flashable image
        run: |
          BUILD=.pio/build/cardputer-adv
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          echo "using boot_app0 at: $BOOT_APP0"
          python -m esptool --chip esp32s3 merge_bin -o "$BUILD/merged-firmware.bin" \
            0x0000 "$BUILD/bootloader.bin" \
            0x8000 "$BUILD/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$BUILD/firmware.bin"

      - name: Upload merged .bin artifact
        uses: actions/upload-artifact@v4
        with:
          name: cardputer-firmware-merged
          path: .pio/build/cardputer-adv/merged-firmware.bin
          if-no-files-found: error